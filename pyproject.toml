[tool.poetry]
name = "habit-tracker"
version = "1.0.0"
description = "Backend for habit tracker application"
authors = ["Your Name <email@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
Django = "^4.2"
djangorestframework = "^3.14"
djangorestframework-simplejwt = "^5.3"
django-cors-headers = "^4.3"
django-filter = "^23.5"
drf-spectacular = "^0.27"
psycopg2-binary = "^2.9"
celery = "^5.3"
redis = "^5.0"
python-dotenv = "^1.0"
pytz = "^2023.3"
requests = "^2.31"
Pillow = "^10.1"
django-celery-beat = "^2.5"
gunicorn = "^21.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-django = "^4.5"
pytest-cov = "^4.1"
pytest-celery = "^0.0.0"
flake8 = "^6.1"
isort = "^5.12"
black = "^26.5.1"
factory-boy = "^3.3"
faker = "^20.0"

[tool.poetry.scripts]
start = "manage.py:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = "test_*.py"
testpaths = ["apps"]
addopts = "--cov=. --cov-report=html --cov-report=term --cov-report=xml"
