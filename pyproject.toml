[project]
name = "habit-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "django (>=6.1,<7.0)",
    "python-decouple (>=3.8,<4.0)",
    "django-crispy-forms (>=2.7,<3.0)",
    "django-crispy-bootstrap (>=0.1.1.1,<0.2.0.0)",
    "django-redis (>=7.0.0,<8.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-filter (>=26.1,<27.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pytz (>=2026.3.post1,<2027.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.poetry.scripts]
start = "manage.py:main"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = "test_*.py"
testpaths = ["apps"]
addopts = "--cov=. --cov-report=html --cov-report=term --cov-report=xml"
